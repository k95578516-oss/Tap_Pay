spring.application.name=Tap_Pay
server.port=8080

# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/tap_pay
spring.datasource.username=root
spring.datasource.password=3c4d5e6f
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# SWAGGER
# =========================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.tap_pay
springdoc.pathsToMatch=/api/**

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.example.tap_pay=DEBUG